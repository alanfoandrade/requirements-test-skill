<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Relatório de testes</title>
<style>
/* Layout: cabeçalho + resumo com barra de aderência, abas (Requisitos / Bugs / Pendências), tabela filtrável com linhas expansíveis */
:root{
  --bg:#f6f5f2; --surface:#ffffff; --fg:#1d1c1a; --muted:#6b675f; --line:#e3e0d8;
  --accent:#8a6d4b; --accent-soft:#efe8de;
  --ok:#2f7d4f; --ok-bg:#e2f2e8;
  --part:#a36a00; --part-bg:#fbefd2;
  --no:#b3372e; --no-bg:#f9e0dd;
  --bug:#7a2a8c; --bug-bg:#f0e1f5;
  --unk:#5b6270; --unk-bg:#e6e8ec;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15140f; --surface:#1e1d18; --fg:#ece9e1; --muted:#9d988c; --line:#322f27;
  --accent:#c9a77c; --accent-soft:#2b261d;
  --ok:#6fcf97; --ok-bg:#183323; --part:#f2b94b; --part-bg:#3a2d10;
  --no:#ff8a80; --no-bg:#40201d; --bug:#d9a0ec; --bug-bg:#34213c; --unk:#a9b0bf; --unk-bg:#2a2d34; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15140f; --surface:#1e1d18; --fg:#ece9e1; --muted:#9d988c; --line:#322f27;
  --accent:#c9a77c; --accent-soft:#2b261d;
  --ok:#6fcf97; --ok-bg:#183323; --part:#f2b94b; --part-bg:#3a2d10;
  --no:#ff8a80; --no-bg:#40201d; --bug:#d9a0ec; --bug-bg:#34213c; --unk:#a9b0bf; --unk-bg:#2a2d34; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header h1{font-size:26px;font-weight:600;margin:0 0 4px;text-wrap:balance}
header p{margin:0;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.summary{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:center}
.gauge{position:relative;width:180px;height:180px;margin:auto}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .c strong{font-size:38px;font-weight:600;font-variant-numeric:tabular-nums}
.gauge .c span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:transparent;text-align:left;font:inherit;color:inherit;cursor:pointer}
.stat:hover,.stat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.stat .n{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:14px;grid-column:1/-1;background:var(--line)}
.bar i{display:block}
.risks{margin:0;padding-left:18px;color:var(--fg)} .risks li{margin:4px 0}
.risks-title{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:inherit;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent);font-weight:500}
.tab .cnt{font-family:var(--font-mono);font-size:11px;margin-left:6px;background:var(--accent-soft);padding:1px 6px;border-radius:9px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tools input,.tools select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
.tools input{flex:1 1 220px}
.tools button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:flex;flex-direction:column}
.grp{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 0 6px}
.row{border-top:1px solid var(--line)}
.row>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:48px 1fr auto 16px;gap:10px;align-items:center;width:100%;padding:10px 4px;cursor:pointer}
.row>button:hover{background:var(--accent-soft)}
.row>button:focus-visible{outline:2px solid var(--accent)}
.rid{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.rname{min-width:0}
.chev{transition:transform .15s;color:var(--muted)} .row.open .chev{transform:rotate(90deg)}
.badge{font-size:12px;font-weight:500;padding:2px 9px;border-radius:10px;white-space:nowrap}
.s-ok{background:var(--ok-bg);color:var(--ok)} .s-part{background:var(--part-bg);color:var(--part)}
.s-no{background:var(--no-bg);color:var(--no)} .s-bug{background:var(--bug-bg);color:var(--bug)} .s-unk{background:var(--unk-bg);color:var(--unk)}
.detail{display:none;padding:2px 4px 14px 62px;color:var(--muted)}
.row.open .detail{display:block}
.detail code,.ev{font-family:var(--font-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--fg);overflow-wrap:anywhere}
.detail p{margin:4px 0}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card p{margin:4px 0;color:var(--muted)}
.sev{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:4px}
.sev-Alto{background:var(--no-bg);color:var(--no)} .sev-Médio{background:var(--part-bg);color:var(--part)} .sev-Baixo{background:var(--unk-bg);color:var(--unk)}
.tc{border:1px solid var(--line);border-radius:8px;margin-bottom:8px}.tc>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:64px 1fr auto auto 16px;gap:10px;align-items:center;width:100%;padding:10px 12px;cursor:pointer}.tc>button:hover{background:var(--accent-soft)}.tc .body{display:none;padding:2px 12px 12px;color:var(--muted)}.tc.open .body{display:block}.tc.open .chev{transform:rotate(90deg)}.tc .body p{margin:4px 0}.type{font-family:var(--font-mono);font-size:11px;color:var(--muted)}@media (max-width:640px){.tc>button{grid-template-columns:56px 1fr 16px}.tc>button .badge,.tc>button .type{grid-column:2;justify-self:start}}.empty{padding:24px;text-align:center;color:var(--muted)}
.env{border-left:3px solid var(--part);padding:8px 12px;background:var(--part-bg);color:var(--fg);border-radius:0 6px 6px 0;font-size:13px}
footer{color:var(--muted);font-size:12px}
@media (max-width:640px){
  .summary{grid-template-columns:1fr}
  .row>button{grid-template-columns:40px 1fr 16px} .row>button .badge{grid-column:2;justify-self:start}
  .detail{padding-left:14px}
}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<div class="wrap">
  <header>
    <h1 id="h-title">Relatório de testes</h1>
    <p id="h-sub"></p>
    <div class="meta" id="h-meta"></div>
  </header>
  <div class="env" id="env" hidden></div>
  <section class="panel summary" aria-label="Resumo">
    <div class="gauge">
      <svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="12"/><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="0 327"/></svg>
      <div class="c"><strong id="pct">0%</strong><span>taxa de aprovação</span><span id="cov"></span></div>
    </div>
    <div><div class="stats" id="stats"></div><div class="stats" id="tstats" style="margin-top:10px"></div></div>
    <div class="bar" id="bar" aria-hidden="true"></div>
    <div style="grid-column:1/-1" id="risks-box">
      <p class="risks-title">Maiores riscos</p>
      <ol class="risks" id="risks"></ol>
    </div>
  </section>
  <section class="panel" aria-label="Detalhes">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="view" style="padding-top:14px"></div>
  </section>
  <footer id="foot"></footer>
</div>

<script>
/* Substitua apenas este bloco.
   Veredito do requisito (s): pass | partial | fail | blocked | untested. Todo requisito que não passou precisa de exp (o que pede), got (o que foi encontrado), obs (a causa) e, quando houver, fix.
   Resultado do caso (r): pass | fail | blocked | skip.
   sev: Crítico | Alto | Médio | Baixo. Listas opcionais: comparison, notImplemented, openDecisions, outOfScope, limits, createdTests, nextSteps (strings ou {t,d}). */
const DATA = {
  title: 'Relatório de testes',
  subtitle: 'Documento de requisitos testado e resumo em uma linha.',
  meta: ['repo-a main abc1234', 'ambiente: local', '2026-01-01'],
  env: 'O que foi executado e as limitações do ambiente.',
  risks: ['Maior risco 1', 'Maior risco 2'],
  requirements: [
    {g:'Área', id:'REQ-01', name:'Exemplo de requisito', s:'fail', tcs:['TC-001'], ev:'repo:arquivo:linha',
     exp:'O que o documento pede, em uma frase.', got:'O que o sistema faz hoje.', obs:'Causa: por que isso reprova o requisito.', fix:'Como corrigir.'}
  ],
  tests: [
    {id:'TC-001', req:'REQ-01', name:'Exemplo de caso', type:'api', r:'pass', steps:'1. Passo. 2. Passo.', expected:'Esperado.', actual:'Obtido.', ev:'GET /x → 200'}
  ],
  defects: [
    {sev:'Alto', t:'Título', where:'repo:arquivo:linha', req:'REQ-01', d:'Passos para reproduzir e esperado × obtido.', fix:'Correção sugerida.'}
  ],
  notImplemented: [],
  openDecisions: [],
  outOfScope: [],
  limits: [],
  createdTests: [],
  nextSteps: [],
  foot: 'Taxa de aprovação = requisitos aprovados ÷ executados (aprovados + parciais + falhos). Cobertura = executados ÷ total.'
};

const ST={pass:'Passou',partial:'Parcial',fail:'Falhou',blocked:'Bloqueado',untested:'Não testado'};
const CLS={pass:'ok',partial:'part',fail:'no',blocked:'bug',untested:'unk'};
const COL={pass:'var(--ok)',partial:'var(--part)',fail:'var(--no)',blocked:'var(--bug)',untested:'var(--unk)'};
const RT={pass:'Passou',fail:'Falhou',blocked:'Bloqueado',skip:'Não testado'};
const RCLS={pass:'ok',fail:'no',blocked:'bug',skip:'unk'};
const RCOL={pass:'var(--ok)',fail:'var(--no)',blocked:'var(--bug)',skip:'var(--unk)'};
const SEVS={'Crítico':'Alto','Alto':'Alto','Médio':'Médio','Baixo':'Baixo'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=DATA.requirements||[], T=DATA.tests||[], D=DATA.defects||[];
const LISTS=[['comparison','Comparação com a execução anterior'],['notImplemented','Não implementado'],['openDecisions','Decisões em aberto'],['outOfScope','Fora de escopo e divergências'],['limits','Bloqueios e limitações'],['createdTests','Testes criados'],['nextSteps','Próximos passos']].filter(([k])=>(DATA[k]||[]).length);
const counts={pass:0,partial:0,fail:0,blocked:0,untested:0};R.forEach(r=>{if(counts[r.s]!==undefined)counts[r.s]++});
const tcounts={pass:0,fail:0,blocked:0,skip:0};T.forEach(t=>{if(tcounts[t.r]!==undefined)tcounts[t.r]++});
const executed=counts.pass+counts.partial+counts.fail;
const pct=executed?Math.round(counts.pass/executed*100):0;
const cov=R.length?Math.round(executed/R.length*100):0;
let filter='all',q='',tfilter='all',tab='req';

document.title=DATA.title;
$('#h-title').textContent=DATA.title;
$('#h-sub').textContent=DATA.subtitle||'';
$('#h-meta').innerHTML=(DATA.meta||[]).map(m=>'<span>'+esc(m)+'</span>').join('');
if(DATA.env){$('#env').hidden=false;$('#env').textContent=DATA.env}
if((DATA.risks||[]).length)$('#risks').innerHTML=DATA.risks.map(r=>'<li>'+esc(r)+'</li>').join('');else $('#risks-box').hidden=true;
$('#foot').textContent=DATA.foot||'';
$('#pct').textContent=pct+'%';
$('#cov').textContent='cobertura '+cov+'%';
$('#arc').setAttribute('stroke-dasharray',(327*pct/100).toFixed(1)+' 327');
$('#bar').innerHTML=Object.keys(counts).map(k=>'<i style="width:'+(R.length?counts[k]/R.length*100:0)+'%;background:'+COL[k]+'" title="'+ST[k]+': '+counts[k]+'"></i>').join('');

function renderStats(){
  $('#stats').innerHTML=Object.keys(counts).map(k=>'<button class="stat" data-k="'+k+'" aria-pressed="'+(filter===k)+'"><div class="n">'+counts[k]+'</div><div class="l"><span class="dot" style="background:'+COL[k]+'"></span>Requisitos: '+ST[k].toLowerCase()+'</div></button>').join('');
  $('#tstats').innerHTML=Object.keys(tcounts).map(k=>'<button class="stat" data-t="'+k+'" aria-pressed="'+(tfilter===k)+'"><div class="n">'+tcounts[k]+'</div><div class="l"><span class="dot" style="background:'+RCOL[k]+'"></span>Casos: '+RT[k].toLowerCase()+'</div></button>').join('');
  document.querySelectorAll('#stats .stat').forEach(b=>b.onclick=()=>{filter=filter===b.dataset.k?'all':b.dataset.k;tab='req';renderTabs();renderStats();render()});
  document.querySelectorAll('#tstats .stat').forEach(b=>b.onclick=()=>{tfilter=tfilter===b.dataset.t?'all':b.dataset.t;tab='tc';renderTabs();renderStats();render()});
}
function renderTabs(){
  const t=[['req','Requisitos',R.length],['tc','Casos de teste',T.length],['def','Defeitos',D.length]].concat(LISTS.map(([k,l])=>[k,l,DATA[k].length]));
  $('#tabs').innerHTML=t.map(([k,l,n])=>'<button class="tab" role="tab" aria-selected="'+(tab===k)+'" data-t="'+k+'">'+esc(l)+'<span class="cnt">'+n+'</span></button>').join('');
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderTabs();render()});
}
function item(x){return typeof x==='string'?'<p style="margin:0;color:var(--fg)">'+esc(x)+'</p>':'<h3>'+esc(x.t||x.title||'')+'</h3><p>'+esc(x.d||x.text||'')+'</p>'}
function toggleAll(sel,btn){const rows=[...document.querySelectorAll(sel)];const open=rows.some(r=>!r.classList.contains('open'));rows.forEach(r=>{r.classList.toggle('open',open);r.firstChild.setAttribute('aria-expanded',open)});btn.textContent=open?'Recolher tudo':'Expandir tudo'}
function reqDetail(r){
  const linked=(r.tcs||[]).map(id=>T.find(t=>t.id===id)).filter(Boolean);
  const bad=linked.filter(t=>t.r==='fail'||t.r==='blocked');
  const motivo={fail:'Por que falhou',partial:'O que falta para passar',blocked:'Por que ficou bloqueado',untested:'Por que não foi testado',pass:'O que foi verificado'}[r.s]||'Observação';
  let h='';
  if(r.exp)h+='<p><b>O que o requisito pede:</b> '+esc(r.exp)+'</p>';
  if(r.got)h+='<p><b>O que foi encontrado:</b> '+esc(r.got)+'</p>';
  if(r.obs)h+='<p><b>'+motivo+':</b> '+esc(r.obs)+'</p>';
  if(!r.exp&&!r.got)bad.forEach(t=>{h+='<p><b>'+esc(t.id)+' — esperado:</b> '+esc(t.expected||'—')+'</p><p><b>'+esc(t.id)+' — obtido:</b> '+esc(t.actual||'—')+'</p>'});
  if(r.fix)h+='<p><b>Como corrigir:</b> '+esc(r.fix)+'</p>';
  if(!h)h='<p>Sem observações.</p>';
  if(linked.length)h+='<p><b>Casos de teste:</b> '+linked.map(t=>'<span class="ev">'+esc(t.id)+'</span> <span class="badge s-'+RCLS[t.r]+'">'+(RT[t.r]||esc(t.r))+'</span>').join(' &nbsp; ')+'</p>';
  else h+='<p><b>Casos de teste:</b> nenhum</p>';
  h+='<p><b>Evidência:</b> <span class="ev">'+esc(r.ev||'—')+'</span></p>';
  return h;
}
function bindSearch(){$('#q').oninput=e=>{q=e.target.value.toLowerCase();const p=e.target.selectionStart;render();const i=$('#q');i.focus();i.setSelectionRange(p,p)}}
function render(){
  const v=$('#view');
  if(tab==='req'){
    const list=R.filter(r=>(filter==='all'||r.s===filter)&&(!q||(r.id+' '+r.name+' '+(r.obs||'')+' '+(r.ev||'')).toLowerCase().includes(q)));
    let h='<div class="tools"><input id="q" type="search" placeholder="Buscar requisito, caso ou evidência" value="'+esc(q)+'" aria-label="Buscar"><select id="f" aria-label="Filtrar por veredito"><option value="all">Todos os vereditos</option>'+Object.keys(ST).map(k=>'<option value="'+k+'"'+(filter===k?' selected':'')+'>'+ST[k]+'</option>').join('')+'</select><button id="ex">Expandir tudo</button></div><div class="list">';
    if(!list.length)h+='<div class="empty">Nenhum requisito para este filtro.</div>';
    let g=null;
    list.forEach(r=>{
      if(r.g!==g){g=r.g;if(g)h+='<div class="grp">'+esc(g)+'</div>'}
      h+='<div class="row"><button aria-expanded="false"><span class="rid">'+esc(r.id)+'</span><span class="rname">'+esc(r.name)+'</span><span class="badge s-'+CLS[r.s]+'">'+(ST[r.s]||esc(r.s))+'</span><span class="chev">›</span></button><div class="detail">'+reqDetail(r)+'</div></div>';
    });
    v.innerHTML=h+'</div>';
    bindSearch();
    $('#f').onchange=e=>{filter=e.target.value;renderStats();render()};
    $('#ex').onclick=()=>toggleAll('.row',$('#ex'));
    document.querySelectorAll('.row>button').forEach(b=>b.onclick=()=>{const r=b.parentElement;const o=r.classList.toggle('open');b.setAttribute('aria-expanded',o)});
  }else if(tab==='tc'){
    const list=T.filter(t=>(tfilter==='all'||t.r===tfilter)&&(!q||(t.id+' '+t.req+' '+t.name+' '+(t.actual||'')+' '+(t.ev||'')).toLowerCase().includes(q)));
    let h='<div class="tools"><input id="q" type="search" placeholder="Buscar requisito, caso ou evidência" value="'+esc(q)+'" aria-label="Buscar"><select id="f" aria-label="Filtrar por resultado"><option value="all">Todos os resultados</option>'+Object.keys(RT).map(k=>'<option value="'+k+'"'+(tfilter===k?' selected':'')+'>'+RT[k]+'</option>').join('')+'</select><button id="ex">Expandir tudo</button></div>';
    if(!list.length)h+='<div class="empty">Nenhum caso para este filtro.</div>';
    list.forEach(t=>{
      h+='<div class="tc"><button aria-expanded="false"><span class="rid">'+esc(t.id)+'</span><span class="rname">'+esc(t.name)+' <span class="rid">('+esc(t.req)+')</span></span><span class="type">'+esc(t.type||'')+'</span><span class="badge s-'+RCLS[t.r]+'">'+(RT[t.r]||esc(t.r))+'</span><span class="chev">›</span></button><div class="body"><p>Passos: '+esc(t.steps||'—')+'</p><p>Esperado: '+esc(t.expected||'—')+'</p><p>Obtido: '+esc(t.actual||'—')+'</p><p>Evidência: <span class="ev">'+esc(t.ev||'—')+'</span></p></div></div>';
    });
    v.innerHTML=h;
    bindSearch();
    $('#f').onchange=e=>{tfilter=e.target.value;renderStats();render()};
    $('#ex').onclick=()=>toggleAll('.tc',$('#ex'));
    document.querySelectorAll('.tc>button').forEach(b=>b.onclick=()=>{const r=b.parentElement;const o=r.classList.toggle('open');b.setAttribute('aria-expanded',o)});
  }else if(tab==='def'){
    v.innerHTML=D.length?D.map(b=>'<div class="card"><h3><span class="sev sev-'+(SEVS[b.sev]||'Baixo')+'">'+esc(b.sev)+'</span>'+esc(b.t)+(b.req?' <span class="rid">('+esc(b.req)+')</span>':'')+'</h3><p>'+esc(b.d)+'</p><p>Onde: <span class="ev">'+esc(b.where)+'</span></p>'+(b.fix?'<p>Sugestão: '+esc(b.fix)+'</p>':'')+'</div>').join(''):'<div class="empty">Nenhum defeito registrado.</div>';
  }else{
    v.innerHTML=(DATA[tab]||[]).map(x=>'<div class="card">'+item(x)+'</div>').join('');
  }
}
renderStats();renderTabs();render();
</script>
